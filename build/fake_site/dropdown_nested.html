<!doctype html>
<!--
AUTHORED SYNTHETIC reconstruction of the NEW nested #customReport dropdown the
TSMIS site is migrating to (seen on the dev site, BUILD_DATE 2026-06-25). NOT a
copy of the Caltrans-internal source: it carries only the class names, data-*
attributes, and flyout :hover behavior that select_report depends on.

Mirrors the live structure:
  * Highway Log / Highway Sequence Listing stay FLAT top-level cs-option rows.
  * A non-selectable "TSAR Reports" cs-header.
  * Highway / Intersection / Ramp are cs-parent flyout rows, each holding a
    cs-submenu of cs-leaf options whose VISIBLE text is just "Detail"/"Summary",
    the full name in data-label, and the stable id in data-value (== the value
    the live page writes into its hidden native <select>).
  * The Highway group ships cs-disabled (the "coming soon" Highway Detail/Summary).

A leaf is hidden (display:none) until its parent row is hovered (CSS :hover only,
no JS) -- so a selector that does not reveal the flyout cannot click a leaf. This
is exactly the contract select_report's submenu-reveal must satisfy.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>dropdown: nested</title>
  <style>
    .cs-list { display: none; list-style: none; margin: 0; padding: 0; }
    .cs.is-open .cs-list { display: block; }
    .cs-option, .cs-parent, .cs-header { padding: 0.4rem 1.25rem; }
    .cs-header { font-weight: 700; cursor: default; }
    .cs-disabled { color: #9ca3af; cursor: default; }
    /* Flyout parent rows and their submenus -- revealed on hover only. */
    .cs-parent { position: relative; cursor: default; }
    .cs-submenu {
      display: none; position: absolute; left: 100%; top: -1px;
      min-width: 11rem; background: #fff; border: 1px solid #003484;
      list-style: none; margin: 0; padding: 0.25rem 0;
    }
    .cs-parent:hover > .cs-submenu { display: block; }
  </style>
</head>
<body>
  <!-- The hidden native select the real page keeps in sync with the custom widget:
       a click on a leaf writes its data-value here (main.js: hidden.value =
       opt.dataset.value), and it carries a real <option> per report so the value
       sticks. current_report_value() reads this to confirm the armed report by its
       STABLE id -- immune to the nested leaf's short visible text. -->
  <select id="reportSelect" style="display:none;">
    <option value="" disabled selected hidden>-- Select report --</option>
    <option value="highway_log">Highway Log</option>
    <option value="highway_sequence">Highway Sequence Listing</option>
    <option value="highway_detail">Highway Detail</option>
    <option value="highway_summary">Highway Summary</option>
    <option value="clean_highway">Clean Road File Highway</option>
    <option value="clean_intersection">Clean Road File Intersection</option>
    <option value="clean_ramp">Clean Road File Ramp</option>
    <option value="intersection_detail">Intersection Detail</option>
    <option value="intersection_summary">Intersection Summary</option>
    <option value="Ramp_Detail">Ramp Detail</option>
    <option value="Ramp_Summary">Ramp Summary</option>
  </select>
  <div class="cs" id="customReport">
    <div class="cs-trigger">
      <span class="cs-value">-- Select report --</span>
      <span class="cs-arrow">&#9660;</span>
    </div>
    <ul class="cs-list">
      <li class="cs-option" data-value="highway_log">Highway Log</li>
      <li class="cs-option" data-value="highway_sequence">Highway Sequence Listing</li>
      <!-- The "Clean Road Files" group (dev site 9.1, BUILD_DATE 2026-08-19): a
           cs-header followed by FLAT cs-option cs-sub rows -- indented under the
           header but NOT fly-out leaves (no cs-parent, no cs-submenu, no hover
           reveal). Visible text is the short "Highway" (which also happens to be
           a TSAR fly-out parent's text); the full name is in data-label and the
           stable id in data-value. -->
      <li class="cs-header">Clean Road Files</li>
      <li class="cs-option cs-sub" data-value="clean_highway"      data-label="Clean Road File Highway">Highway</li>
      <li class="cs-option cs-sub" data-value="clean_intersection" data-label="Clean Road File Intersection">Intersection</li>
      <li class="cs-option cs-sub" data-value="clean_ramp"         data-label="Clean Road File Ramp">Ramp</li>
      <li class="cs-header">TSAR Reports</li>
      <li class="cs-sub cs-parent cs-disabled">Highway
        <ul class="cs-submenu">
          <li class="cs-option cs-leaf cs-disabled" data-value="highway_detail"  data-label="Highway Detail">Detail</li>
          <li class="cs-option cs-leaf cs-disabled" data-value="highway_summary" data-label="Highway Summary">Summary</li>
        </ul>
      </li>
      <li class="cs-sub cs-parent">Intersection
        <ul class="cs-submenu">
          <li class="cs-option cs-leaf" data-value="intersection_detail"  data-label="Intersection Detail">Detail</li>
          <li class="cs-option cs-leaf" data-value="intersection_summary" data-label="Intersection Summary">Summary</li>
        </ul>
      </li>
      <li class="cs-sub cs-parent">Ramp
        <ul class="cs-submenu">
          <li class="cs-option cs-leaf" data-value="Ramp_Detail"  data-label="Ramp Detail">Detail</li>
          <li class="cs-option cs-leaf" data-value="Ramp_Summary" data-label="Ramp Summary">Summary</li>
        </ul>
      </li>
    </ul>
  </div>

  <!-- Synthetic 2026-08 form contract. Postmile mode added another control
       labelled "District"; it remains in the DOM while District/Route mode is
       active, so accessible-label lookup is ambiguous even though this row is
       hidden. The exporter must target the long-stable structural IDs. -->
  <button id="modeBtnDistrictRoute" type="button" disabled>
    District / County / Route
  </button>
  <div id="controlsGrid">
    <div id="districtRow" style="display:none">
      <label for="districtSelect">District</label>
      <select id="districtSelect">
        <option value="pick" disabled selected>-- Select District --</option>
        <option value="">-- ALL --</option>
        <option value="01">01</option>
      </select>
    </div>
    <div id="districtCountyRow" style="display:none">
      <label for="districtCountySelect">County</label>
      <select id="districtCountySelect" disabled>
        <option value="pick" disabled selected>-- Select County --</option>
        <option value="">-- ALL --</option>
      </select>
    </div>
    <div id="districtRouteRow" style="display:none">
      <label for="districtRouteSelect">Route</label>
      <select id="districtRouteSelect">
        <option value="001">001</option>
      </select>
    </div>
    <div id="pmDistrictRow" style="display:none">
      <label for="pm-district">District</label>
      <select id="pm-district"><option value="ALL">ALL</option></select>
    </div>
    <button id="districtRouteBtn" type="button" style="display:none">Generate</button>
    <button id="translateBtn" type="button" style="display:none">Generate</button>
  </div>
  <script>
    // Mirror the live widget: a click on an ENABLED option records its full name
    // (data-label, else the visible text) into window.__picked and the cs-value,
    // so a test can confirm WHICH option was chosen. Disabled options get no
    // handler -- a click is a no-op there, as on the real page.
    window.__picked = null;
    const cs = document.getElementById('customReport');
    const csValue = cs.querySelector('.cs-value');
    const hidden = document.getElementById('reportSelect');
    const mode = document.getElementById('modeBtnDistrictRoute');
    const district = document.getElementById('districtSelect');
    const county = document.getElementById('districtCountySelect');
    mode.addEventListener('click', () => {
      document.getElementById('districtRow').style.display = 'flex';
      document.getElementById('districtCountyRow').style.display = 'flex';
      document.getElementById('districtRouteRow').style.display = 'flex';
      document.getElementById('pmDistrictRow').style.display = 'none';
      document.getElementById('districtRouteBtn').style.display = 'inline-block';
    });
    district.addEventListener('change', () => {
      county.disabled = false;
    });
    cs.querySelector('.cs-trigger').addEventListener('click',
      () => cs.classList.toggle('is-open'));
    cs.querySelectorAll('.cs-option:not(.cs-disabled)').forEach(opt => {
      opt.addEventListener('click', () => {
        const name = opt.dataset.label || (opt.textContent || '').trim();
        window.__picked = name;
        csValue.textContent = name;
        hidden.value = opt.dataset.value;   // mirror the stable id, as main.js does
        mode.disabled = false;
        cs.classList.remove('is-open');
      });
    });
  </script>
</body>
</html>
